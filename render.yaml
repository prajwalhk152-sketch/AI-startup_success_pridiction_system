services:
  - type: web
    name: ai-startup-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd ai-startup-frontend && npm install && npm run build
    startCommand: gunicorn api.startup_api:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: ai-startup-frontend
    runtime: static
    rootDir: ai-startup-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-startup-api.onrender.com
