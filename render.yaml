services:
  - type: web
    name: ai-startup-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.startup_api:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: static
    name: ai-startup-frontend
    rootDir: ai-startup-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-startup-api
          property: host
